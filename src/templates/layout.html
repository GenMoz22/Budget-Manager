<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='favicon.ico') }}" rel="icon">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">

    <title>Budget Manager: {% block title %}{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('budget.index') }}">
            <span class="blue">B</span><span class="red">u</span><span class="yellow">d</span><span class="blue">g</span><span class="green">e</span><span class="red">t</span>
            <span class="blue">M</span><span class="red">a</span><span class="yellow">n</span><span class="blue">a</span><span class="green">g</span><span class="red">e</span><span class="blue">r</span>
        </a>
        <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbar">
            {% if session.get("user_id") %}
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('budget.index') }}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('budget.add_expense') }}">Add Expense</a></li>
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('budget.history') }}">History</a></li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('budget.profile') }}">Profile</a></li>
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('auth.logout') }}">Log Out</a></li>
            </ul>
            {% else %}
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('auth.register') }}">Register</a></li>
                <li class="nav-item"><a class="nav-item nav-link" href="{{ url_for('auth.login') }}">Log In</a></li>
            </ul>
            {% endif %}
        </div>
    </div>
</nav>

{% if get_flashed_messages() %}
<header>
    <div class="alert alert-primary alert-dismissible fade show mb-0 text-center" role="alert">
        {{ get_flashed_messages() | join(" ") }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</header>
{% endif %}

<main class="container-fluid py-5 text-center">
    {% block main %}{% endblock %}
</main>

<footer class="mb-5 small text-center text-muted">
    <p>&copy; 2026 Budget Manager.</p>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeBtn = document.createElement('button');
            themeBtn.id = 'change-theme-btn';
            themeBtn.innerText = 'Theme Mode';

            themeBtn.style.position = 'fixed';
            themeBtn.style.bottom = '20px';
            themeBtn.style.right = '20px';
            themeBtn.style.zIndex = '1000';
            themeBtn.className = 'btn btn-outline-secondary btn-sm shadow-sm';

            document.body.appendChild(themeBtn);

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.classList.replace('btn-outline-secondary', 'btn-light');
            }

            themeBtn.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');

                if (document.body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    themeBtn.classList.replace('btn-outline-secondary', 'btn-light');
                } else {
                    localStorage.setItem('theme', 'light');
                    themeBtn.classList.replace('btn-light', 'btn-outline-secondary');
                }
            });
        });
    </script>
</footer>
</body>
</html>
